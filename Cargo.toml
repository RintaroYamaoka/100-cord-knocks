[package]
name = "rust-100-knocks-api"
version = "0.1.0"
edition = "2021"
publish = false

# Vercel 公式 Rust ランタイム: api/*.rs を個別バイナリとしてビルドする
[[bin]]
name = "execute"
path = "api/execute.rs"

# ローカル検証用サーバー (本番では使わない)。
# execute.rs の dispatch を直接呼ぶことで、検証ハーネスが本番と食い違わないようにする。
[[bin]]
name = "local-server"
path = "tools/local_server.rs"

[dependencies]
shared = { path = "crates/shared" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
vercel_runtime = "2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# nonce / cmdId の乱数。推測可能な nonce は判定を偽装させる穴になる
getrandom = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[workspace]
resolver = "2"
members = [".", "crates/shared", "crates/app", "crates/verifier"]

[profile.release]
opt-level = "s"
lto = true
